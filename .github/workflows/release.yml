name: Release Windows installer

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_VISIBILITY: ${{ github.event.repository.visibility }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install test dependencies
        shell: pwsh
        run: |
          uv sync --frozen --python 3.12 --extra server
          if ($LASTEXITCODE) { throw 'Python dependency installation failed.' }
          .venv/Scripts/python.exe -c "from hindsightkit.cli import install_node_packages; install_node_packages(); install_node_packages(client=True)"
          if ($LASTEXITCODE) { throw 'Node dependency installation failed.' }
      - name: Run tests
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Tests failed.' }
      - name: Build the pinned PostgreSQL distribution
        shell: pwsh
        run: |
          $distribution = Join-Path $env:RUNNER_TEMP 'hindsightkit-postgres/pgsql'
          $cache = Join-Path $env:RUNNER_TEMP 'hindsightkit-postgres-downloads'
          ./src/hindsightkit/postgres_install.ps1 -Destination $distribution -CacheDirectory $cache
          if ($LASTEXITCODE) { throw 'PostgreSQL packaging failed.' }
          .venv/Scripts/python.exe tests/live_postgres.py --distribution $distribution
          if ($LASTEXITCODE) { throw 'PostgreSQL runtime validation failed.' }
      - name: Package this repository's release
        shell: pwsh
        run: |
          $distribution = Join-Path $env:RUNNER_TEMP 'hindsightkit-postgres/pgsql'
          .venv/Scripts/python.exe distribution/package_release.py --version $env:RELEASE_TAG --repository $env:GITHUB_REPOSITORY --server-url $env:GITHUB_SERVER_URL --visibility $env:RELEASE_VISIBILITY --postgres-directory $distribution --output dist/release
          if ($LASTEXITCODE) { throw 'Release packaging failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_HOST: github.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "HindsightKit $RELEASE_TAG" --notes-file release/release-notes.md release/install.ps1 release/hindsightkit-windows-x64.zip release/postgresql-18.6-pgvector-0.8.6-windows-x64.zip release/QUICKSTART.md release/release-notes.md release/SHA256SUMS
