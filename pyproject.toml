[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsightkit"
version = "0.1.8"
description = "Set up local Hindsight memory for GitHub Copilot."
requires-python = ">=3.12,<3.13"
dependencies = [
    "hindsight-client==0.10.0",
    "hindsight-copilot==0.1.0",
    "fastmcp==4.0.4",
    "mcp==2.2.0",
    "filelock==3.32.7",
    "github-copilot-sdk==1.0.14",
]

[project.optional-dependencies]
server = [
    "hindsight-api-slim[local-onnx]==0.10.0",
    "hindsight-embed==0.10.0",
]

[project.scripts]
hindsightkit = "hindsightkit.cli:main"

[tool.setuptools.package-data]
hindsightkit = ["node/*.mjs", "node/client/*.json", "node/server/*.json", "scripts/*.ps1", "web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
